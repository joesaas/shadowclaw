id: write-false-success
title: 写入工具报成功，文件却不在盘上
scenario: troubleshooting
source: 排障手册常见坑 2（收录清单写入假成功，2026-10-12）
brief: |
  一份清单文档要写入工作区：写入工具回执明确报告「写入成功，15,683
  字节」。但随后全盘查找这个文件根本不存在，引用它的页面也缺了这一
  节。同一个工具写小文件一直正常，这次是大文件一次写完出的事。
  先定界、拿证据，再下结论。
materials: |
  附带材料（当时可见的原始输出，据记录还原）：
  - 写入回执：success，reported_bytes = 15683
  - 全盘 find 该文件名：无结果；目标路径 ls：文件不存在
  - 小文件写入并回读：正常
reference:
  root_cause: >-
    写入并没有真正落盘：回执报告的「成功 + 15,683 字节」是假成功，
    文件从未写到磁盘上。单次回执不可信，大文件写入必须回读核验。
  key_actions:
    - 写入后回读核验：查文件是否真在盘上、大小与章节是否对得上
    - 改用分段写入（大文件拆成多段 append）
    - 逐段核验落盘结果（最终字节数与预期一致、章节完整）
  source: 2026-10-12 收录清单写入记录（排障手册常见坑 2；后分三段重写并核验 22,821 字节）
scoring:
  root_cause_groups:
    - ["落盘", "盘上", "磁盘"]
    - ["假成功", "并未", "没有真正", "未真正", "实际不存在", "从未"]
  actions:
    - id: readback-verify
      label: 回读核验（大小/章节）
      any: ["回读", "核验", "wc", "大小", "章节"]
    - id: chunked-write
      label: 改用分段写入
      any: ["分段", "分片", "多段", "拆段", "append"]
    - id: verify-final-bytes
      label: 核验最终字节数/完整性
      any: ["字节数", "逐段核验", "完整性", "对得上"]
