id: github-app-no-create-permission
title: GitHub App 建仓与 fork 连续 403
scenario: troubleshooting
source: 排障手册常见坑 5（GitHub App 权限边界，2026-10-14；AGENTS.md 备忘）
brief: |
  用 GitHub App 的集成身份调 API 建仓库：create_repository 返回
  403 "Resource not accessible by integration"；换 fork_repository
  想 fork 一个仓库，同样 403、同样的报文。但同一个 App 读仓库文件、
  往已有仓库推文件都正常，凭证也没过期。已经换参数重试过两次，都是
  403。先定界、拿证据，再下结论。
materials: |
  附带材料（当时可见的原始输出，据记录还原）：
  - POST create_repository → 403 {"message": "Resource not accessible by integration"}
  - POST fork_repository → 403，同上
  - 同一 App：读文件、push_files 到已有仓库均成功
reference:
  root_cause: >-
    这是能力边界不是 bug：该 GitHub App 本就没有建仓与 fork 权限
    （Resource not accessible by integration），调用层再怎么重试都不会
    成功；该 App 的权限范围只覆盖既有仓库的读写。
  key_actions:
    - 同类操作两次 403 先查能力边界，停止在调用层反复重试
    - 改走可行路线：由人在 GitHub 网页端手动建空仓，再用 App 推送
    - 把这条能力边界写进工具备忘（AGENTS.md），避免下次重踩
  source: 2026-10-14 实测记录（AGENTS.md「GitHub App 权限边界」/ 排障手册常见坑 5）
scoring:
  root_cause_groups:
    - ["权限", "能力边界"]
    - ["没有", "无此", "不具备", "未授予", "本就无", "不支持"]
    - ["建仓", "创建仓库", "fork", "建仓库"]
  actions:
    - id: stop-retrying-check-boundary
      label: 停止重试，先查能力/权限边界
      any: ["停止重试", "不要重试", "不再重试", "查权限", "能力边界", "权限边界", "权限清单"]
    - id: manual-create-then-push
      label: 改走人工建仓后推送的可行路线
      any: ["手动建仓", "人工建仓", "网页端", "手动创建", "手动建", "建空仓"]
    - id: record-boundary
      label: 把能力边界记录进备忘/文档
      any: ["写进", "记录", "备忘", "记进", "沉淀"]
